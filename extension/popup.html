<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 260px;
      padding: 12px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      margin: 0;
    }
    .warning {
      color: #d9a441;
      margin-bottom: 12px;
      padding: 8px;
      background-color: rgba(217, 164, 65, 0.1);
      border-radius: 4px;
    }
    .section {
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e0e0e0;
    }
    .section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    label {
      user-select: none;
      cursor: pointer;
    }
    input[type="checkbox"] {
      cursor: pointer;
    }
    a {
      color: #0078d4;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="content"></div>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
