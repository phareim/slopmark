<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      max-width: 560px;
      margin: 0 auto;
      padding: 20px;
      color: #333;
    }
    h1 {
      font-size: 24px;
      margin-top: 0;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
    }
    input[type="text"],
    input[type="password"],
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: system-ui, monospace;
      font-size: 13px;
      box-sizing: border-box;
    }
    input[type="text"]:focus,
    input[type="password"]:focus,
    textarea:focus {
      outline: none;
      border-color: #0078d4;
      box-shadow: 0 0 0 2px rgba(0, 120, 212, 0.1);
    }
    textarea {
      resize: vertical;
      min-height: 150px;
    }
    .help-text {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
    button {
      padding: 8px 16px;
      background-color: #0078d4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #005a9e;
    }
    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      display: none;
    }
    .status.success {
      background-color: #dff0d8;
      color: #3c763d;
      display: block;
    }
  </style>
</head>
<body>
  <h1>slopmark Settings</h1>

  <div class="form-group">
    <label for="backendUrl">Backend URL</label>
    <input type="text" id="backendUrl" placeholder="https://sleeper.phareim.no/slopmark">
    <div class="help-text">Where to send text for analysis</div>
  </div>

  <div class="form-group">
    <label for="key">API Key</label>
    <input type="password" id="key" placeholder="Your API key">
    <div class="help-text">Authorization token for the backend</div>
  </div>

  <div class="form-group">
    <label for="blocklist">Blocklist (one pattern per line)</label>
    <textarea id="blocklist" placeholder="mail.google.com&#10;*.slack.com"></textarea>
    <div class="help-text">Hosts where slopmark won't check. Use * for subdomains (e.g., *.example.com)</div>
  </div>

  <button id="save">Save</button>
  <div id="status" class="status"></div>

  <script src="settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
